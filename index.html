<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 사이트</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f3f5f9;
      color: #202632;
      font-family: system-ui, sans-serif;
      line-height: 1.6;
    }

    main {
      width: 100%;
      max-width: 440px;
      padding: 32px;
      background: white;
      border: 1px solid #e2e6ed;
      border-radius: 20px;
      box-shadow: 0 12px 40px #2336540d;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    h2 {
      margin-top: 24px;
      font-size: 20px;
    }

    p {
      margin: 8px 0 20px;
    }

    .muted {
      color: #687386;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd2dd;
      border-radius: 10px;
      font: inherit;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid #93b9ff;
      outline-offset: 3px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #2865db;
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1f52b6;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .link {
      margin-top: 10px;
      background: transparent;
      color: #2865db;
    }

    .link:hover {
      background: #eef4ff;
    }

    #message {
      margin: 16px 0 0;
      overflow-wrap: anywhere;
    }

    #message:empty {
      display: none;
    }

    hr {
      margin: 24px 0;
      border: 0;
      border-top: 1px solid #e2e6ed;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main>
    <!-- 로그인 화면 -->
    <section id="login">
      <h1>로그인</h1>
      <p class="muted">로그인하고 나만의 사이트에 들어가 보세요.</p>

      <form id="loginForm" action="#" method="post">
        <label for="loginId">아이디</label>
        <input
          id="loginId"
          name="username"
          autocomplete="username"
          required
        >

        <label for="loginPassword">비밀번호</label>
        <input
          id="loginPassword"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button type="submit">로그인</button>
      </form>

      <button class="link" type="button" id="openSignup">
        계정이 없나요? 회원가입
      </button>

      <p class="muted">
        회원가입 정보는 현재 브라우저에 저장되는 연습용 사이트입니다.
      </p>
    </section>

    <!-- 회원가입 화면 -->
    <section id="signup" hidden>
      <h1>회원가입</h1>
      <p class="muted">새로운 계정을 만들어 보세요.</p>

      <form id="signupForm" action="#" method="post">
        <label for="signupId">아이디</label>
        <input
          id="signupId"
          name="username"
          autocomplete="username"
          minlength="2"
          maxlength="30"
          required
        >

        <label for="signupPassword">비밀번호</label>
        <input
          id="signupPassword"
          name="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          placeholder="8자 이상 입력"
          required
        >

        <label for="confirmPassword">비밀번호 확인</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <button type="submit">회원가입</button>
      </form>

      <button class="link" type="button" id="openLogin">
        로그인으로 돌아가기
      </button>
    </section>

    <!-- 로그인 후 나오는 화면 -->
    <section id="home" hidden>
      <h1>나만의 사이트</h1>
      <p id="greeting"></p>

      <hr>

      <!-- 아래 제목과 글을 원하는 내용으로 바꾸면 됩니다. -->
      <h2>해동고사전</h2>
	  <h1>1.수틱</h1>
	  <p>
		  건드리면 안되는 존재
	  </p>
	  <br>
	  <h1>2.신의정</h1>
	  <p>
		  뚱뚱이 첫사랑
	  </p>
	  <br>
	  <h1>3.팽창올림픽</h1>
	  <p>
		  건드리면 안되는 존재2
	  </p>
      <button type="button" id="logout">로그아웃</button>
    </section>

    <p id="message" role="status" aria-live="polite"></p>

    <noscript>
      회원가입과 로그인을 사용하려면 JavaScript를 켜 주세요.
    </noscript>
  </main>

  <script>
    // 서버 없이 현재 브라우저에서만 동작하는 로그인 예제입니다.
    // HTML 안의 글을 비공개로 보호하는 기능은 아닙니다.
    const storageKey = 'my-site-accounts-v1';
    const message = document.getElementById('message');

    function showPage(id) {
      document.querySelectorAll('main > section').forEach(section => {
        section.hidden = section.id !== id;
      });

      document.querySelectorAll('input[type="password"]').forEach(input => {
        input.value = '';
      });

      message.textContent = '';

      document.querySelector(
        '#' + id + ' input, #' + id + ' button'
      )?.focus();
    }

    function getAccounts() {
      const accounts = JSON.parse(
        localStorage.getItem(storageKey) || '[]'
      );

      if (!Array.isArray(accounts)) {
        throw new Error('저장된 계정 정보를 읽을 수 없습니다.');
      }

      return accounts;
    }

    // 비밀번호 원문 대신 salt와 비밀번호 해시를 저장합니다.
    async function hashPassword(password, salt) {
      if (!globalThis.crypto?.subtle) {
        throw new Error(
          '이 브라우저에서는 로그인 기능을 실행할 수 없습니다. ' +
          '최신 브라우저의 HTTPS 또는 localhost 주소에서 열어 주세요.'
        );
      }

      const key = await crypto.subtle.importKey(
        'raw',
        new TextEncoder().encode(password),
        'PBKDF2',
        false,
        ['deriveBits']
      );

      const bits = await crypto.subtle.deriveBits(
        {
          name: 'PBKDF2',
          salt: new Uint8Array(salt),
          iterations: 100000,
          hash: 'SHA-256'
        },
        key,
        256
      );

      return Array.from(
        new Uint8Array(bits),
        byte => byte.toString(16).padStart(2, '0')
      ).join('');
    }

    async function handleSubmit(event) {
      event.preventDefault();

      const form = event.currentTarget;
      const button = form.querySelector('button[type="submit"]');
      const username = form.elements.username.value.trim();
      const password = form.elements.password.value;

      button.disabled = true;
      message.textContent = '처리 중입니다…';

      try {
        if (!username) {
          throw new Error('아이디를 입력해 주세요.');
        }

        if (form.id === 'signupForm') {
          if (username.length < 2) {
            throw new Error('아이디는 2자 이상 입력해 주세요.');
          }

          if (password !== form.elements.confirmPassword.value) {
            throw new Error('비밀번호가 서로 다릅니다.');
          }

          const salt = Array.from(
            crypto.getRandomValues(new Uint8Array(16))
          );

          const hash = await hashPassword(password, salt);
          const accounts = getAccounts();

          if (accounts.some(account => account.username === username)) {
            throw new Error('이미 사용 중인 아이디입니다.');
          }

          accounts.push({ username, salt, hash });
          localStorage.setItem(storageKey, JSON.stringify(accounts));

          form.reset();
          showPage('login');

          document.getElementById('loginId').value = username;
          document.getElementById('loginPassword').focus();

          message.textContent = '회원가입 완료! 이제 로그인해 주세요.';
        } else {
          const account = getAccounts().find(
            account => account.username === username
          );

          if (
            !account ||
            await hashPassword(password, account.salt) !== account.hash
          ) {
            throw new Error('아이디 또는 비밀번호가 올바르지 않습니다.');
          }

          form.reset();

          document.getElementById('greeting').textContent =
            username + '님, 환영합니다!';

          showPage('home');
        }
      } catch (error) {
        const storageErrors = [
          'SecurityError',
          'QuotaExceededError',
          'SyntaxError'
        ];

        message.textContent = storageErrors.includes(error.name)
          ? '브라우저의 저장 공간을 사용할 수 없습니다. 사이트 데이터 설정을 확인해 주세요.'
          : error.message;
      } finally {
        button.disabled = false;
      }
    }

    document.getElementById('openSignup').addEventListener(
      'click', () => showPage('signup')
    );

    document.getElementById('openLogin').addEventListener(
      'click', () => showPage('login')
    );

    document.getElementById('logout').addEventListener('click', () => {
      document.getElementById('greeting').textContent = '';
      showPage('login');
    });

    document.getElementById('signupForm').addEventListener(
      'submit', handleSubmit
    );

    document.getElementById('loginForm').addEventListener(
      'submit', handleSubmit
    );
  </script>
</body>
</html>
